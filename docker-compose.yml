
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: directus
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  directus:
    image: directus/directus:latest
    restart: always
    ports:
      - "8056:8055"
    environment:
      KEY: "mydirectusapp"
      SECRET: "supersecret"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "password"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
      CORS_METHODS: "GET,POST,PATCH,DELETE"
      CORS_HEADERS: "Content-Type,Authorization"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "postgres"
      DB_PASSWORD: "root"

      PUBLIC_URL: "http://localhost:8056"
    depends_on:
      - postgres

     #healthcheck:
       #test: ["CMD-SHELL", "wget -q --spider http://localhost:8055/server/health || exit 1"]
       #interval: 10s
       #timeout: 5s
       #retries: 10
       #start_period: 30s
      #disable: true

  bootstrap:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
     #depends_on:
       #directus:
         #condition: service_healthy
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_EMAIL: admin@example.com
      DIRECTUS_ADMIN_PASSWORD: password
    command: >
      sh -c "
      echo '⏳ Attente du démarrage de Directus...' &&
      npm install @directus/sdk dotenv 
      "
